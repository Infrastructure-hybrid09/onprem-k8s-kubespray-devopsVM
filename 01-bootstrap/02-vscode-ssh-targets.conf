# CURRENT means the normal account that runs the distribution script on DevOps.
# ASK:NAME prompts once for that team's approved account and reuses it.
# k8s uses DevOps ~/.ssh/neuroplan_k8s for the initial login.
# password uses the existing account's password or any key already available to ssh.
