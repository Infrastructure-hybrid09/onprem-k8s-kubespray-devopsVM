---
baseline_packages:
  - curl
  - wget
  - git
  - vim-enhanced
  - jq
  - bash-completion
  - tar
  - rsync
  - iproute
  - bind-utils
  - net-tools
  - python3
  - openssh-server
  - sudo

neuroplan_management_hosts:
  - { ip: "192.168.14.11", names: ["lb1.nplan.local", "lb1"] }
  - { ip: "192.168.14.12", names: ["lb2.nplan.local", "lb2"] }
  - { ip: "192.168.14.21", names: ["devops.nplan.local", "devops"] }
  - { ip: "192.168.14.31", names: ["cp1.nplan.local", "cp1"] }
  - { ip: "192.168.14.32", names: ["cp2.nplan.local", "cp2"] }
  - { ip: "192.168.14.33", names: ["cp3.nplan.local", "cp3"] }
  - { ip: "192.168.14.41", names: ["worker1.nplan.local", "worker1"] }
  - { ip: "192.168.14.42", names: ["worker2.nplan.local", "worker2"] }
  - { ip: "192.168.14.43", names: ["worker3.nplan.local", "worker3"] }
  - { ip: "192.168.14.51", names: ["db-primary.nplan.local", "db-primary", "db1"] }
  - { ip: "192.168.14.52", names: ["db-replica.nplan.local", "db-replica", "db2"] }
  - { ip: "192.168.14.61", names: ["nfs.nplan.local", "nfs"] }
