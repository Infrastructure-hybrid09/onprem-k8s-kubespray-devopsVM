  - { ip: "192.168.24.12", names: ["lb2.dmz.nplan.local", "lb2-dmz"] }

neuroplan_internal_hosts:
  - { ip: "192.168.34.11", names: ["lb1.k8s.nplan.local", "lb1-k8s"] }
  - { ip: "192.168.34.12", names: ["lb2.k8s.nplan.local", "lb2-k8s"] }
  - { ip: "192.168.34.21", names: ["devops.k8s.nplan.local", "devops-k8s"] }
  - { ip: "192.168.34.31", names: ["cp1.k8s.nplan.local", "cp1-k8s"] }
  - { ip: "192.168.34.32", names: ["cp2.k8s.nplan.local", "cp2-k8s"] }
  - { ip: "192.168.34.33", names: ["cp3.k8s.nplan.local", "cp3-k8s"] }
  - { ip: "192.168.34.41", names: ["worker1.k8s.nplan.local", "worker1-k8s"] }
  - { ip: "192.168.34.42", names: ["worker2.k8s.nplan.local", "worker2-k8s"] }
  - { ip: "192.168.34.43", names: ["worker3.k8s.nplan.local", "worker3-k8s"] }
  - { ip: "192.168.34.62", names: ["infra.k8s.nplan.local", "infra-k8s"] }
  # Compatibility alias only; Kubernetes uses the VIP address as its canonical endpoint.
  - { ip: "192.168.34.100", names: ["api.k8s.neuroplan.local"] }

neuroplan_data_hosts:
  - { ip: "192.168.44.41", names: ["worker1.data.nplan.local", "worker1-data"] }
  - { ip: "192.168.44.42", names: ["worker2.data.nplan.local", "worker2-data"] }
  - { ip: "192.168.44.43", names: ["worker3.data.nplan.local", "worker3-data"] }
  - { ip: "192.168.44.51", names: ["db-primary.data.nplan.local", "db-primary-data"] }
  - { ip: "192.168.44.52", names: ["db-replica.data.nplan.local", "db-replica-data"] }
  - { ip: "192.168.44.61", names: ["nfs.data.nplan.local", "nfs-data"] }
  - { ip: "192.168.44.62", names: ["infra.data.nplan.local", "infra-data"] }

neuroplan_host_records: >-
  {{
    neuroplan_management_hosts
    + neuroplan_dmz_hosts
    + neuroplan_internal_hosts
    + neuroplan_data_hosts
  }}
