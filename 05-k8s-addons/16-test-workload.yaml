---
apiVersion: v1
kind: ConfigMap
metadata:
  name: validation-echo-config
  namespace: application
  labels:
    validation.neuroplan.io/owned: "true"
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
      }

      location / {
        default_type text/plain;
        return 200 "validation-ok pod=$hostname uri=$request_uri\n";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: validation-echo
  namespace: application
  labels:
    app.kubernetes.io/name: validation-echo
    validation.neuroplan.io/owned: "true"
spec:
  replicas: 3
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: validation-echo
      app.kubernetes.io/instance: validation
  template:
    metadata:
      labels:
        app.kubernetes.io/name: validation-echo
        app.kubernetes.io/instance: validation
        validation.neuroplan.io/owned: "true"
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      terminationGracePeriodSeconds: 15
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: validation-echo
                    app.kubernetes.io/instance: validation
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: validation-echo
              app.kubernetes.io/instance: validation
      containers:
        - name: nginx
          image: 192.168.34.21:5000/neuroplan/nginx:1.28-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            timeoutSeconds: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: validation-echo-config
---
apiVersion: v1
kind: Service
metadata:
  name: validation-echo
  namespace: application
  labels:
    app.kubernetes.io/name: validation-echo
    validation.neuroplan.io/owned: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: validation-echo
    app.kubernetes.io/instance: validation
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: validation-busybox
  namespace: application
  labels:
    validation.neuroplan.io/owned: "true"
spec:
  nodeSelector:
    node-role.kubernetes.io/worker: "true"
  restartPolicy: Never
  containers:
    - name: busybox
      image: 192.168.34.21:5000/neuroplan/busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c", "sleep 86400"]
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: validation-curl
  namespace: application
  labels:
    validation.neuroplan.io/owned: "true"
spec:
  nodeSelector:
    node-role.kubernetes.io/worker: "true"
  restartPolicy: Never
  containers:
    - name: curl
      image: 192.168.34.21:5000/neuroplan/curl:8.12.1
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c", "sleep 86400"]
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
